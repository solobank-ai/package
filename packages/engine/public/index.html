<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solobank AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0b;
      color: #e4e4e7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid #1e1e22;
    }
    .logo { font-weight: 700; font-size: 18px; }
    .logo span { background: linear-gradient(135deg, #14F195, #9945FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .wallet { font-size: 13px; color: #71717a; font-family: monospace; }

    /* Balance */
    .balance-bar {
      text-align: center;
      padding: 24px 0 16px;
    }
    .balance-amount { font-size: 36px; font-weight: 700; }
    .balance-label { font-size: 13px; color: #71717a; margin-top: 4px; }

    /* Chat area */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #1e1e22;
      color: #e4e4e7;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #14141a;
      border: 1px solid #1e1e22;
    }
    .msg.tool {
      align-self: flex-start;
      background: #0d1117;
      border: 1px solid #14F19530;
      font-family: monospace;
      font-size: 12px;
      color: #14F195;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .msg.tool .tool-name {
      font-weight: 600;
      color: #9945FF;
      margin-bottom: 4px;
    }
    .greeting {
      text-align: center;
      color: #52525b;
      font-size: 14px;
      margin-top: auto;
      margin-bottom: 8px;
    }

    /* Input area */
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid #1e1e22;
    }
    .input-box {
      display: flex;
      align-items: center;
      background: #14141a;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 4px;
    }
    .input-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e4e4e7;
      padding: 12px 16px;
      font-size: 14px;
    }
    .input-box input::placeholder { color: #52525b; }
    .input-box button {
      background: #14F195;
      color: #0a0a0b;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .input-box button:disabled { opacity: 0.3; cursor: not-allowed; }
    .input-box button:hover:not(:disabled) { background: #0fd682; }

    /* Quick actions */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .actions button {
      background: #14141a;
      color: #a1a1aa;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: monospace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .actions button:hover { border-color: #14F195; color: #14F195; }

    .streaming-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #14F195;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    @media (max-width: 640px) {
      .header { padding: 12px 16px; }
      .chat { padding: 12px 16px; }
      .input-area { padding: 12px 16px 20px; }
      .balance-amount { font-size: 28px; }
      .msg { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><span>Solobank</span> AI</div>
    <div class="wallet" id="wallet">connecting...</div>
  </div>

  <div class="balance-bar">
    <div class="balance-amount" id="balance">—</div>
    <div class="balance-label">available balance</div>
  </div>

  <div class="chat" id="chat">
    <div class="greeting">Ask anything about your finances</div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <input type="text" id="input" placeholder="Ask anything..." autocomplete="off" />
      <button id="send" onclick="sendMessage()">↑</button>
    </div>
    <div class="actions">
      <button onclick="quickAction('Check my balance')">BALANCE</button>
      <button onclick="quickAction('Show lending rates for USDC')">RATES</button>
      <button onclick="quickAction('What can you do?')">HELP</button>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    let sessionId = null;
    let isStreaming = false;

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isStreaming) sendMessage();
    });

    function addMessage(role, content) {
      // Remove greeting
      const greeting = chatEl.querySelector('.greeting');
      if (greeting) greeting.remove();

      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = content;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function addToolCall(name, data) {
      const greeting = chatEl.querySelector('.greeting');
      if (greeting) greeting.remove();

      const div = document.createElement('div');
      div.className = 'msg tool';
      div.innerHTML = `<div class="tool-name">⚡ ${name}</div>${typeof data === 'string' ? data : JSON.stringify(data, null, 2)}`;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isStreaming) return;

      inputEl.value = '';
      isStreaming = true;
      sendBtn.disabled = true;

      addMessage('user', text);

      // Add streaming indicator
      const assistantDiv = addMessage('assistant', '');
      const dot = document.createElement('span');
      dot.className = 'streaming-dot';
      assistantDiv.appendChild(dot);

      let fullText = '';

      try {
        const res = await fetch(`${API}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: text }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const event = JSON.parse(line.slice(6));

              if (event.type === 'text') {
                fullText = event.data.content;
                assistantDiv.textContent = fullText;
              } else if (event.type === 'tool_call') {
                addToolCall(event.data.name, event.data.args);
              } else if (event.type === 'tool_result') {
                // Update last tool card with result
              } else if (event.type === 'done') {
                sessionId = event.data.sessionId;
              } else if (event.type === 'error') {
                assistantDiv.textContent = `Error: ${event.data.message}`;
              }
            } catch {}
          }
        }

        if (!fullText) {
          assistantDiv.textContent = assistantDiv.textContent || 'No response';
        }
      } catch (err) {
        assistantDiv.textContent = `Connection error: ${err.message}`;
      }

      // Remove dot if still there
      const dotEl = assistantDiv.querySelector('.streaming-dot');
      if (dotEl) dotEl.remove();

      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    function quickAction(text) {
      inputEl.value = text;
      sendMessage();
    }

    // Try to get initial balance
    fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'What is my wallet address and balance? Be very brief.' }),
    }).then(async (res) => {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        for (const line of buf.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          try {
            const ev = JSON.parse(line.slice(6));
            if (ev.type === 'tool_result' && ev.data.name === 'solobank_balance') {
              const b = ev.data.result;
              document.getElementById('balance').textContent = `$${(b.usdc || 0).toFixed(2)}`;
            }
            if (ev.type === 'tool_result' && ev.data.name === 'solobank_address') {
              const a = ev.data.result.address || '';
              document.getElementById('wallet').textContent = a.slice(0, 6) + '...' + a.slice(-4);
            }
            if (ev.type === 'done') {
              sessionId = ev.data.sessionId;
            }
          } catch {}
        }
        buf = '';
      }
    }).catch(() => {
      document.getElementById('wallet').textContent = 'offline';
    });
  </script>
</body>
</html>
